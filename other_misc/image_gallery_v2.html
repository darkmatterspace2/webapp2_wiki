<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Justified Gallery + Fullscreen</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
  }

  /* ===== Justified Gallery ===== */
  .gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
  }

  .gallery img {
    height: 220px;              /* row height */
    width: auto;
    flex-grow: 1;
    object-fit: cover;
    display: block;
    cursor: pointer;
  }

  /* ===== Fullscreen Viewer ===== */
  .viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  .viewer img {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
  }

  .viewer.active {
    display: flex;
  }

  /* Close hint */
  .hint {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: #aaa;
    font-size: 12px;
    font-family: system-ui, sans-serif;
    pointer-events: none;
  }
</style>
</head>

<body>

<div class="gallery">
<img src="https://gals.kindgirls.com/d11/ariana_regent_20_30943/ariana_regent_20_30943_1.jpg">
<img src="https://gals.kindgirls.com/d11/ariana_regent_20_85489/ariana_regent_20_85489_1.jpg">
<img src="https://gals.kindgirls.com/d11/ariana_regent_20_85489/ariana_regent_20_85489_5.jpg">
<img src="https://gals.kindgirls.com/d11/ariana_regent_20_85489/ariana_regent_20_85489_11.jpg">
<img src="https://gals.kindgirls.com/d11/ariana_regent_20_34343/ariana_regent_20_34343_2.jpg">
<img src="https://gals.kindgirls.com/d11/ariana_regent_20_47671/ariana_regent_20_47671_5.jpg">
<img src="https://gals.kindgirls.com/d11/sofia_venko_22_48757/sofia_venko_22_48757_7.jpg">
<img src="https://gals.kindgirls.com/d11/sofia_venko_23_75439/sofia_venko_23_75439_14.jpg">
</div>

<!-- Fullscreen Viewer -->
<div class="viewer" id="viewer">
  <img id="viewerImg">
</div>

<div class="hint">Click image to view • Click anywhere or press ESC to close</div>

<script>
  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewerImg');

  document.querySelectorAll('.gallery img').forEach(img => {
    img.onclick = () => {
      viewerImg.src = img.src;
      viewer.classList.add('active');
    };
  });

  viewer.onclick = () => viewer.classList.remove('active');
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') viewer.classList.remove('active');
  });
</script>

</body>
</html>
