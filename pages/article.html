<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - RetroWiki 2k25</title>
    <link rel="stylesheet" href="../css/main.css">
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Config -->
    <script src="../src/config/app.config.js"></script>
    <script src="../src/config/supabase.config.js"></script>
    <!-- Services -->
    <script src="../src/services/article.service.js"></script>
    <script src="../src/services/storage.service.js"></script>
    <script src="../src/services/category.service.js"></script>
    <!-- Shared -->
    <script src="../src/shared/utils.js"></script>
    <script src="../src/shared/theme-loader.js"></script>
    <script src="../src/shared/layout.js"></script>
    <script src="../src/shared/lightbox.js"></script>
</head>

<body>

    <div id="article-view">
        <div id="article-meta">
            <!-- Populated by JS -->
        </div>
        <hr>
        <div id="article-content">
            <p><i>Loading article...</i></p>
        </div>
        <hr>
        <p><a href="../index.html">&lt;&lt; Back to Index</a></p>
    </div>

    <script>
        let currentMeta = null;

        async function initArticle() {
            const id = AppUtils.getParam('id');
            if (!id) {
                document.getElementById('article-content').innerHTML = '<p style="color:red;">No article ID provided.</p>';
                return;
            }

            AppUtils.showLoading(true);

            try {
                // Use ArticleService to get metadata
                const meta = await ArticleService.getById(id);
                currentMeta = meta;

                // Update page title
                document.title = `${meta.title} - RetroWiki 2k25`;

                // Check if user is logged in (for showing edit/delete buttons)
                const sbClient = AppUtils.initSupabase();
                const user = await AppUtils.checkAuth(sbClient);

                // Restricted R-rated Content Guard
                const isRRated = meta.ratings && ['M', 'P', 'X'].includes(meta.ratings);
                if (isRRated && !user) {
                    document.getElementById('article-meta').innerHTML = `
                        <div class="article-header">
                            <h2>${meta.title}</h2>
                        </div>
                        <p><small>Rating: <b>${meta.ratings}</b></small></p>
                    `;
                    document.getElementById('article-content').innerHTML = `
                        <div style="padding: 30px; text-align: center; border: 2px solid var(--border-color); background: var(--header-bg); margin: 20px 0;">
                            <h3 style="color: red; margin-top: 0;">[ RESTRICTED CONTENT ]</h3>
                            <p>This article is rated <b>${meta.ratings}</b> and is restricted to logged-in users.</p>
                            <p><a href="admin/login.html">[ Admin Login ]</a></p>
                        </div>
                    `;
                    AppUtils.showLoading(false);
                    return;
                }

                const actionButtons = user ? `
                    <span class="article-actions">
                        <button onclick="editArticle()">[ Edit ]</button>
                        <button onclick="deleteArticle()" class="btn-delete">[ Delete ]</button>
                    </span>` : '';

                // Generate clickable tag links
                const tagLinks = (meta.tags || []).map(tag =>
                    `<a href="../index.html?q=${encodeURIComponent(tag)}" class="tag-link">${tag}</a>`
                ).join(' ');

                // Render metadata with action buttons in title row
                document.getElementById('article-meta').innerHTML = `
                    <div class="article-header">
                        <h2>${meta.title}</h2>
                        ${actionButtons}
                    </div>
                    <p>
                        <b>Category:</b> ${meta.category} | 
                        <b>Tags:</b> ${tagLinks || 'None'} | 
                        <b>Views:</b> ${meta.views || 0}
                    </p>
                    <p><small>Created: ${AppUtils.formatDate(meta.created_at)}</small></p>
                `;

                // Use StorageService to get content
                const contentHtml = await StorageService.downloadAsText(meta.bucket_path);
                document.getElementById('article-content').innerHTML = contentHtml;

                // 1. Format Galleries (Masonry)
                formatGalleries();

                // 2. Initialize Lightbox
                if (window.Lightbox) {
                    Lightbox.init();
                    Lightbox.attach('#article-content img');
                }

                // Increment views
                ArticleService.incrementViews(id, meta.views);

            } catch (error) {
                console.error(error);
                document.getElementById('article-content').innerHTML = '<p style="color:red;">Error loading article.</p>';
            }

            AppUtils.showLoading(false);
        }

        // MASONRY GALLERY LOGIC
        function getDefaultGalleryCols() {
            if (window.innerWidth <= 480) return 1;
            if (window.innerWidth <= 768) return 2;
            return 3;
        }
        window.getDefaultGalleryCols = getDefaultGalleryCols;

        let currentGalleryCols = getDefaultGalleryCols();
        window.currentGalleryCols = currentGalleryCols;

        window.changeGalleryColumns = function (delta) {
            currentGalleryCols = (window.currentGalleryCols || getDefaultGalleryCols()) + delta;
            if (currentGalleryCols < 1) currentGalleryCols = 1;
            if (currentGalleryCols > 6) currentGalleryCols = 6;
            window.currentGalleryCols = currentGalleryCols;

            // Re-format all galleries
            formatGalleries(currentGalleryCols);
            if (window.Layout && window.Layout.updateGalleryColsIndicator) {
                window.Layout.updateGalleryColsIndicator(currentGalleryCols);
            }
        };

        function formatGalleries(forceCols = null) {
            const galleries = document.querySelectorAll('.retro-gallery');
            galleries.forEach(gallery => {
                // 1. Collect all items (either from raw gallery or existing columns)
                let items = [];
                if (gallery.querySelector('.retro-gallery-col')) {
                    // Already formatted? Unwrap - collect .gallery-item wrappers or raw media
                    const cols = gallery.querySelectorAll('.retro-gallery-col');
                    cols.forEach(col => {
                        items.push(...Array.from(col.children));
                    });

                    // SORT BY ORIGINAL INDEX to restore sequence
                    items.sort((a, b) => {
                        return parseInt(a.getAttribute('data-index')) - parseInt(b.getAttribute('data-index'));
                    });
                } else {
                    // First time formatting: Collect raw media/figure and Tag
                    items = Array.from(gallery.children).filter(el => ['IMG', 'VIDEO', 'IFRAME', 'FIGURE'].includes(el.tagName));
                    items.forEach((img, idx) => {
                        img.setAttribute('data-index', idx);
                    });
                }

                if (items.length === 0) return;

                // 2. Determine Column Count ( Force > User Override > Class > Responsive Default )
                let colCount = forceCols;
                if (!colCount) {
                    if (gallery.hasAttribute('data-user-cols')) {
                        colCount = parseInt(gallery.getAttribute('data-user-cols'), 10) || getDefaultGalleryCols();
                    } else if (gallery.classList.contains('cols-2')) {
                        colCount = 2;
                    } else if (gallery.classList.contains('cols-4')) {
                        colCount = 4;
                    } else if (gallery.classList.contains('cols-5')) {
                        colCount = 5;
                    } else {
                        colCount = getDefaultGalleryCols();
                    }
                }

                if (forceCols) {
                    gallery.setAttribute('data-user-cols', colCount);
                }

                // Sync global column counter with active column count
                currentGalleryCols = colCount;
                window.currentGalleryCols = colCount;

                // Ensure parent gallery has zero margin/padding/border
                gallery.style.setProperty('margin', '0', 'important');
                gallery.style.setProperty('padding', '0', 'important');
                gallery.style.setProperty('border', 'none', 'important');
                gallery.style.setProperty('width', '100%', 'important');
                gallery.style.setProperty('gap', '0', 'important');

                // 3. Create columns with strict inline styles ensuring mobile responsiveness & zero gaps
                const cols = [];
                const colPct = (100 / colCount);
                for (let i = 0; i < colCount; i++) {
                    const div = document.createElement('div');
                    div.className = 'retro-gallery-col';
                    div.style.setProperty('flex', `0 0 ${colPct}%`, 'important');
                    div.style.setProperty('max-width', `${colPct}%`, 'important');
                    div.style.setProperty('width', `${colPct}%`, 'important');
                    div.style.setProperty('padding', '0', 'important');
                    div.style.setProperty('margin', '0', 'important');
                    div.style.setProperty('border', 'none', 'important');
                    cols.push(div);
                }

                // 4. Distribute items (preserve order)
                items.forEach((item, index) => {
                    const colIndex = index % colCount;

                    // If already a gallery-item wrapper, just append it
                    if (item.classList && item.classList.contains('gallery-item')) {
                        cols[colIndex].appendChild(item);
                        return;
                    }

                    // FIGURE elements: append directly (they have their own figcaption)
                    if (item.tagName === 'FIGURE') {
                        item.setAttribute('data-index', item.getAttribute('data-index') || index);
                        cols[colIndex].appendChild(item);
                        return;
                    }

                    // Only process media elements
                    if (!['IMG', 'VIDEO', 'IFRAME'].includes(item.tagName)) return;

                    // Wrap in gallery-item
                    const wrapper = document.createElement('div');
                    wrapper.className = 'gallery-item';
                    wrapper.appendChild(item.cloneNode(true));

                    // Create caption from alt, title, or data-caption
                    const caption = item.getAttribute('data-caption') ||
                        item.getAttribute('alt') ||
                        item.getAttribute('title') || '';
                    if (caption) {
                        const captionEl = document.createElement('div');
                        captionEl.className = 'gallery-caption';
                        captionEl.innerHTML = caption;
                        wrapper.appendChild(captionEl);
                    }

                    // Preserve original data-index on wrapper
                    wrapper.setAttribute('data-index', item.getAttribute('data-index'));
                    cols[colIndex].appendChild(wrapper);
                });

                // 5. Clear and Append
                gallery.innerHTML = '';
                cols.forEach(c => gallery.appendChild(c));
            });

            if (window.Layout && window.Layout.checkGalleryPresence) {
                window.Layout.checkGalleryPresence();
            }
            if (window.Layout && window.Layout.updateGalleryColsIndicator) {
                window.Layout.updateGalleryColsIndicator(window.currentGalleryCols);
            }
        }
        window.formatGalleries = formatGalleries;

        // Auto-adapt gallery columns on screen resize if user has not manually customized columns
        window.addEventListener('resize', () => {
            if (!document.querySelector('.retro-gallery[data-user-cols]')) {
                const defaultCols = getDefaultGalleryCols();
                if (defaultCols !== window.currentGalleryCols) {
                    currentGalleryCols = defaultCols;
                    window.currentGalleryCols = defaultCols;
                    formatGalleries();
                }
            }
        });

        async function deleteArticle() {
            if (!currentMeta) return;
            if (!confirm('Are you sure you want to delete this article? This cannot be undone.')) return;

            AppUtils.showLoading(true);

            try {
                // Delete from storage first
                await StorageService.delete(currentMeta.bucket_path);
                // Then delete from database
                await ArticleService.delete(currentMeta.id);

                alert('Article deleted successfully.');
                window.location.href = '../index.html';
            } catch (error) {
                console.error(error);
                alert('Error deleting article: ' + error.message);
            }

            AppUtils.showLoading(false);
        }

        function editArticle() {
            if (!currentMeta) return;
            window.location.href = `admin/editor.html?edit=${currentMeta.id}`;
        }

        window.onload = initArticle;
    </script>
</body>

</html>
