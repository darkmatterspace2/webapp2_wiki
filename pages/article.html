<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - RetroWiki 2k25</title>
    <link rel="stylesheet" href="../style.css">
    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Config -->
    <script src="../src/config/app.config.js"></script>
    <script src="../src/config/supabase.config.js"></script>
    <!-- Services -->
    <script src="../src/services/article.service.js"></script>
    <script src="../src/services/storage.service.js"></script>
    <script src="../src/services/category.service.js"></script>
    <!-- Shared -->
    <script src="../src/shared/utils.js"></script>
    <script src="../src/themes/theme-loader.js"></script>
    <script src="../src/shared/layout.js"></script>
</head>

<body>

    <div id="article-view">
        <div id="article-meta">
            <!-- Populated by JS -->
        </div>
        <hr>
        <div id="article-content">
            <p><i>Loading article...</i></p>
        </div>
        <hr>
        <p><a href="../index.html">&lt;&lt; Back to Index</a></p>
    </div>

    <script>
        let currentMeta = null;

        async function initArticle() {
            const id = AppUtils.getParam('id');
            if (!id) {
                document.getElementById('article-content').innerHTML = '<p style="color:red;">No article ID provided.</p>';
                return;
            }

            AppUtils.showLoading(true);

            try {
                // Use ArticleService to get metadata
                const meta = await ArticleService.getById(id);
                currentMeta = meta;

                // Update page title
                document.title = `${meta.title} - RetroWiki 2k25`;

                // Check if user is logged in (for showing edit/delete buttons)
                const sbClient = AppUtils.initSupabase();
                const user = await AppUtils.checkAuth(sbClient);
                const actionButtons = user ? `
                    <span class="article-actions">
                        <button onclick="editArticle()">[ Edit ]</button>
                        <button onclick="deleteArticle()" class="btn-delete">[ Delete ]</button>
                    </span>` : '';

                // Generate clickable tag links
                const tagLinks = (meta.tags || []).map(tag =>
                    `<a href="../index.html?q=${encodeURIComponent(tag)}" class="tag-link">${tag}</a>`
                ).join(' ');

                // Render metadata with action buttons in title row
                document.getElementById('article-meta').innerHTML = `
                    <div class="article-header">
                        <h2>${meta.title}</h2>
                        ${actionButtons}
                    </div>
                    <p>
                        <b>Category:</b> ${meta.category} | 
                        <b>Tags:</b> ${tagLinks || 'None'} | 
                        <b>Views:</b> ${meta.views || 0}
                    </p>
                    <p><small>Created: ${AppUtils.formatDate(meta.created_at)}</small></p>
                `;

                // Use StorageService to get content
                const contentHtml = await StorageService.downloadAsText(meta.bucket_path);
                document.getElementById('article-content').innerHTML = contentHtml;

                // 1. Format Galleries (Masonry)
                formatGalleries();

                // 2. Initialize Lightbox
                initLightbox();

                // Increment views
                ArticleService.incrementViews(id, meta.views);

            } catch (error) {
                console.error(error);
                document.getElementById('article-content').innerHTML = '<p style="color:red;">Error loading article.</p>';
            }

            AppUtils.showLoading(false);
        }

        // MASONRY GALLERY LOGIC
        let currentGalleryCols = 3;

        window.changeGalleryColumns = function (delta) {
            currentGalleryCols += delta;
            if (currentGalleryCols < 1) currentGalleryCols = 1;
            if (currentGalleryCols > 6) currentGalleryCols = 6;

            // Re-format all galleries
            formatGalleries(currentGalleryCols);
        }

        function formatGalleries(forceCols = null) {
            const galleries = document.querySelectorAll('.retro-gallery');
            galleries.forEach(gallery => {
                // 1. Collect all images (either from raw gallery or existing columns)
                let images = [];
                if (gallery.querySelector('.retro-gallery-col')) {
                    // Already formatted? Unwrap.
                    const cols = gallery.querySelectorAll('.retro-gallery-col');
                    cols.forEach(col => {
                        images.push(...Array.from(col.children));
                    });

                    // SORT BY ORIGINAL INDEX to restore sequence
                    images.sort((a, b) => {
                        return parseInt(a.getAttribute('data-index')) - parseInt(b.getAttribute('data-index'));
                    });
                } else {
                    // First time formatting: Collect and Tag
                    images = Array.from(gallery.children).filter(el => el.tagName === 'IMG');
                    images.forEach((img, idx) => {
                        img.setAttribute('data-index', idx);
                    });
                }

                if (images.length === 0) return;

                // 2. Determine Column Count ( Force > Class > Default )
                let colCount = forceCols || 3;
                if (!forceCols) {
                    if (gallery.classList.contains('cols-2')) colCount = 2;
                    if (gallery.classList.contains('cols-4')) colCount = 4;
                    if (gallery.classList.contains('cols-5')) colCount = 5;
                }

                // 3. Create columns
                const cols = [];
                for (let i = 0; i < colCount; i++) {
                    const div = document.createElement('div');
                    div.className = 'retro-gallery-col';
                    // Dynamic width for flexible resizing
                    div.style.flex = (100 / colCount) + '%';
                    div.style.maxWidth = (100 / colCount) + '%';
                    cols.push(div);
                }

                // 4. Distribute images (preserve order)
                // Filter out non-image elements just in case
                images = images.filter(el => el.tagName === 'IMG');

                images.forEach((img, index) => {
                    const colIndex = index % colCount;
                    cols[colIndex].appendChild(img);
                });

                // 5. Clear and Append
                gallery.innerHTML = '';
                cols.forEach(c => gallery.appendChild(c));
            });
        }

        async function deleteArticle() {
            if (!currentMeta) return;
            if (!confirm('Are you sure you want to delete this article? This cannot be undone.')) return;

            AppUtils.showLoading(true);

            try {
                // Delete from storage first
                await StorageService.delete(currentMeta.bucket_path);
                // Then delete from database
                await ArticleService.delete(currentMeta.id);

                alert('Article deleted successfully.');
                window.location.href = '../index.html';
            } catch (error) {
                console.error(error);
                alert('Error deleting article: ' + error.message);
            }

            AppUtils.showLoading(false);
        }

        function editArticle() {
            if (!currentMeta) return;
            window.location.href = `admin/editor.html?edit=${currentMeta.id}`;
        }

        window.onload = initArticle;

        // LIGHTBOX LOGIC
        // DRAG LOGIC
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0;

        function initLightbox() {
            const images = document.querySelectorAll('#article-content img');
            images.forEach(img => {
                img.style.cursor = 'zoom-in';
                img.onclick = function () {
                    openLightbox(this.src, this.alt);
                }
            });

            // Attach drag events to the lightbox image
            const lightboxImg = document.getElementById('lightbox-img');

            lightboxImg.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX - translateX;
                startY = e.clientY - translateY;
                e.preventDefault(); // Prevent default drag behavior
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                translateX = e.clientX - startX;
                translateY = e.clientY - startY;
                lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px)`;
            });
        }

        function openLightbox(src, alt) {
            const modal = document.getElementById('lightbox');
            const modalImg = document.getElementById('lightbox-img');
            const captionText = document.getElementById('lightbox-caption');

            modal.classList.add('active');
            modalImg.src = src;
            captionText.innerHTML = alt || '';

            // Reset Drag
            translateX = 0;
            translateY = 0;
            modalImg.style.transform = 'translate(0px, 0px)';

            // Default to 'fit'
            resizeLightbox('fit');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');

            // Exit Fullscreen if active
            if (document.fullscreenElement) {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        function resizeLightbox(mode) {
            const img = document.getElementById('lightbox-img');

            // Reset Drag
            translateX = 0;
            translateY = 0;
            img.style.transform = 'translate(0px, 0px)';

            // Reset common styles
            img.style.width = '';
            img.style.height = '';
            img.style.maxWidth = '';
            img.style.maxHeight = '';
            img.style.objectFit = '';
            img.style.margin = 'auto'; // Center by default

            switch (mode) {
                case 'fit':
                    // Default: contained within max dimensions
                    img.style.maxWidth = '90%';
                    img.style.maxHeight = '90vh';
                    img.style.objectFit = 'contain';
                    break;
                case '100':
                    // Natural size, allowing scroll
                    img.style.maxWidth = 'none';
                    img.style.maxHeight = 'none';
                    // No specific width/height set, uses natural
                    break;
                case 'crop':
                    // "Zoom" logic: Fill screen but allow panning (don't clip with object-fit)
                    const winRatio = window.innerWidth / window.innerHeight;
                    const imgRatio = (img.naturalWidth || 1) / (img.naturalHeight || 1);

                    if (imgRatio > winRatio) {
                        // Image is wider than screen relative to height -> Fill Height to cover
                        img.style.height = '100vh';
                        img.style.width = 'auto';
                    } else {
                        // Image is taller than screen relative to width -> Fill Width to cover
                        img.style.width = '100vw'; // 100vw to ensure it covers width
                        img.style.height = 'auto';
                    }

                    img.style.maxWidth = 'none';
                    img.style.maxHeight = 'none';
                    // object-fit not needed as we set dimensions
                    break;
                case 'stretch':
                    // Force fill screen, distorting
                    img.style.width = '100%';
                    img.style.height = '100vh';
                    img.style.maxWidth = 'none';
                    img.style.maxHeight = 'none';
                    img.style.objectFit = 'fill';
                    break;
            }
        }

        function toggleFullScreen() {
            const elem = document.getElementById('lightbox');

            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            }
        }
    </script>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox-modal" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>

        <!-- Image Container -->
        <img class="lightbox-content" id="lightbox-img" onclick="event.stopPropagation()">

        <!-- Controls -->
        <div class="lightbox-controls" onclick="event.stopPropagation()">
            <button onclick="resizeLightbox('fit')">Fit</button>
            <button onclick="resizeLightbox('100')">100%</button>
            <button onclick="resizeLightbox('crop')">Crop</button>
            <button onclick="resizeLightbox('stretch')">Stretch</button>
            <button onclick="toggleFullScreen()">Screen</button>
        </div>

        <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>

</body>

</html>
