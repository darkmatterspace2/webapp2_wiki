<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access - RetroWiki</title>
    <link rel="stylesheet" href="../../css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Config -->
    <script src="../../src/config/app.config.js"></script>
    <script src="../../src/config/supabase.config.js"></script>
    <!-- Shared -->
    <script src="../../src/shared/utils.js"></script>
    <script src="../../src/services/category.service.js"></script>
    <script src="../../src/shared/theme-loader.js"></script>
    <script src="../../src/shared/layout.js"></script>
</head>

<body>

    <div id="view-login">
        <h3>Restricted Access</h3>
        <p>Please log in to manage the wiki.</p>

        <form onsubmit="handleLogin(event)">
            Email: <input type="email" id="login-email" required><br><br>
            Password: <input type="password" id="login-password" required><br><br>
            <button type="submit">Login</button>
            <button type="button" onclick="handleSignUp(event)">Sign Up (Create Admin)</button>
            <br><br>
            <a href="../../index.html">Cancel / Return Home</a>
        </form>
    </div>

    <script>
        function log(msg) {
            console.log('[LOGIN]', msg);
        }

        function getSupabase() {
            if (!window.supabase || !window.SUPABASE_URL) {
                log('ERROR: Supabase not loaded');
                return null;
            }
            return window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
                auth: {
                    persistSession: true,
                    storageKey: 'supabase-auth',
                    storage: window.localStorage,
                    autoRefreshToken: true,
                    detectSessionInUrl: false
                }
            });
        }

        async function handleLogin(e) {
            e.preventDefault();
            log('Login button clicked');

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }

            AppUtils.showLoading(true);

            try {
                const sb = getSupabase();
                if (!sb) throw new Error('Could not initialize Supabase');

                // Clear any existing session
                await sb.auth.signOut({ scope: 'local' });

                // Attempt login
                const { data, error } = await sb.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    log('ERROR: ' + error.message);
                    alert("LOGIN FAILED: " + error.message);
                } else if (data && data.session) {
                    log('SUCCESS! Redirecting...');
                    window.location.href = '../../index.html';
                } else {
                    alert("Login issue: No session returned. Try again.");
                }
            } catch (err) {
                log('EXCEPTION: ' + err.message);
                alert("Error: " + err.message);
            }

            AppUtils.showLoading(false);
        }

        async function handleSignUp(e) {
            e.preventDefault();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert("Enter email/pass");
                return;
            }

            AppUtils.showLoading(true);

            try {
                const sb = getSupabase();
                if (!sb) throw new Error('Could not initialize Supabase');

                const { data, error } = await sb.auth.signUp({ email, password });

                if (error) {
                    alert("SIGN UP FAILED: " + error.message);
                } else {
                    alert("Sign Up Successful! Check email or login.");
                    if (data.session) window.location.href = '../../index.html';
                }
            } catch (err) {
                alert("Error: " + err.message);
            }

            AppUtils.showLoading(false);
        }

        log('Login page loaded');
    </script>

</body>

</html>
