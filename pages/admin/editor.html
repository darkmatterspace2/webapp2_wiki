<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - RetroWiki</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Config -->
    <script src="../../src/config/app.config.js"></script>
    <script src="../../src/config/supabase.config.js"></script>
    <!-- Services -->
    <script src="../../src/services/article.service.js"></script>
    <script src="../../src/services/storage.service.js"></script>
    <script src="../../src/services/category.service.js"></script>
    <!-- Shared -->
    <script src="../../src/shared/utils.js"></script>
    <script src="../../src/themes/theme-loader.js"></script>
    <script src="../../src/shared/layout.js"></script>

    <!-- EDITOR MODULES -->
    <!-- Refactored into separate modules for better maintainability and future expansion -->
    <script src="modules/editor.toolbar.js"></script>
    <script src="modules/editor.preview.js"></script>
    <script src="modules/editor.core.js"></script>
</head>

<body>

    <div id="view-editor" style="max-width: 900px; margin: 0 auto; padding: 10px;">
        <h2 id="editor-title"
            style="border-bottom: 2px solid var(--border-color); padding-bottom: 5px; margin-bottom: 20px;">Create New
            Article</h2>

        <form onsubmit="handleSave(event)">
            <!-- Metadata Section -->
            <fieldset
                style="margin-bottom: 20px; border: 2px solid var(--border-color); padding: 15px; background: var(--bg-color);">
                <legend
                    style="padding: 0 10px; font-weight: bold; border: 2px solid var(--border-color); background: var(--header-bg);">
                    Metadata</legend>
                <table width="100%" cellpadding="5" cellspacing="0">
                    <tr>
                        <td width="120" style="font-weight: bold;">Title:</td>
                        <td><input type="text" id="edit-title" required
                                style="width: 100%; box-sizing: border-box; padding: 5px;"></td>
                    </tr>
                    <tr>
                        <td style="font-weight: bold;">Category:</td>
                        <td>
                            <input type="text" id="edit-category" required style="width: 200px; padding: 5px;">
                            &nbsp;&nbsp;
                            <span style="font-weight: bold;">Rating:</span>
                            <select id="edit-rating" style="padding: 5px;">
                                <option value="NR">NR (Not Rated)</option>
                                <option value="M">M (Mature)</option>
                                <option value="P">P (Prohibited)</option>
                                <option value="X">X (Restricted)</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-weight: bold;">Tags:</td>
                        <td><input type="text" id="edit-tags" placeholder="comma, separated"
                                style="width: 100%; box-sizing: border-box; padding: 5px;"></td>
                    </tr>
                </table>
            </fieldset>

            <!-- Content Section -->
            <fieldset
                style="margin-bottom: 20px; border: 2px solid var(--border-color); padding: 15px; background: var(--bg-color);">
                <legend
                    style="padding: 0 10px; font-weight: bold; border: 2px solid var(--border-color); background: var(--header-bg);">
                    Content</legend>

                <!-- Toolbar -->
                <div
                    style="background: var(--header-bg); border: 2px solid var(--border-color); padding: 8px; margin-bottom: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
                    <button type="button" onclick="format('bold')" title="Bold"
                        style="min-width: 30px;"><b>B</b></button>
                    <button type="button" onclick="format('italic')" title="Italic"
                        style="min-width: 30px;"><i>I</i></button>
                    <button type="button" onclick="format('h2')" title="Header 2">H2</button>
                    <button type="button" onclick="format('h3')" title="Header 3">H3</button>

                    <span style="border-left: 2px solid var(--border-color); height: 20px; margin: 0 5px;"></span>

                    <button type="button" onclick="format('link')" title="Link">Link</button>
                    <button type="button" onclick="format('code')" title="Code Block">Code</button>
                    <button type="button" onclick="format('quote')" title="Blockquote">Quote</button>

                    <span style="border-left: 2px solid var(--border-color); height: 20px; margin: 0 5px;"></span>

                    <button type="button" onclick="insertImage()" title="Insert Image Tag">Image</button>
                    <button type="button" onclick="insertGallery()" title="Insert Gallery Snippet">Gallery</button>
                    <button type="button" onclick="insertVideo()" title="Insert Video Snippet">Video</button>
                </div>

                <textarea id="edit-content" class="editor" required
                    style="width: 100%; height: 500px; box-sizing: border-box; font-family: 'Courier New', monospace; padding: 10px; border: 2px solid var(--border-color); resize: vertical;"></textarea>
                <div style="text-align: right; font-size: 11px; margin-top: 5px; opacity: 0.7;">Supports HTML5. Ensure
                    tags are closed.</div>
            </fieldset>

            <!-- Actions -->
            <div
                style="text-align: right; padding: 15px; background: var(--header-bg); border: 2px solid var(--border-color); margin-top: 20px;">
                <button type="button" onclick="window.history.back()" style="float: left;">&laquo; Cancel</button>
                <button type="button" onclick="showPreview()" style="margin-right: 15px;">Preview Article</button>
                <button type="submit" style="font-weight: bold; padding: 5px 20px;">PUBLISH TO NET</button>
            </div>
        </form>

        <!-- PREVIEW MODAL -->
        <div id="preview-overlay"
            style="display:none; position:fixed; top:20px; left:20px; right:20px; bottom:20px; background:var(--bg-color); border:4px outset var(--border-color); padding:0; z-index:1000; overflow:hidden; box-shadow: 10px 10px 20px rgba(0,0,0,0.5);">
            <div
                style="background:var(--header-bg); padding:10px; border-bottom:2px solid var(--border-color); display:flex; justify-content:space-between; align-items: center;">
                <b style="font-size: 1.2em;">Article Preview</b>
                <button type="button" onclick="closePreview()">X Close</button>
            </div>
            <div style="padding: 20px; overflow-y: auto; height: calc(100% - 60px);">
                <h1 id="preview-title" style="margin-top: 0;"></h1>
                <div class="article-meta" id="preview-meta"
                    style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;">
                </div>
                <div id="preview-body" class="article-content"></div>
            </div>
        </div>
    </div>
</body>

</html>
