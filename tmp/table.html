<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Table</title>
    <style>
        body {
            font-family: sans-serif;
            background: #222;
            color: #fff;
            padding: 20px;
            margin: 0;
        }

        table {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            border-collapse: collapse;
            background: #333;
        }

        th,
        td {
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
            vertical-align: top;
        }

        /* Typography */
        .name-header {
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            background: #444;
            color: #fff;
        }

        .label-header {
            font-size: 18px;
            font-weight: bold;
            color: #ddd;
            background: #2a2a2a;
        }

        /* Media Frame - The Constraint */
        .media-frame {
            width: 100%;
            /* Fixed height ensures uniformity regardless of source aspect ratio */
            height: 300px;
            position: relative;
            background: #000;
            overflow: hidden;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* The Content - The Fill */
        .media-frame img,
        .media-frame video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* KEY: This makes them fill the box without stretching */
            display: block;
        }
    </style>
</head>
