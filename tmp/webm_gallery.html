<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Horizontal Video Cards</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#000;
  padding:40px;
}

/* row container */
.row{
  display:flex;
  gap:24px;           /* space between boxes */
  align-items:flex-start;
}

/* card */
.box{
  width:280px;
  position:relative;
}

/* video */
.box video{
  display:block;
  width:100%;
  height:auto;
}

/* image overlap */
.box img{
  position:absolute;
  left:0;
  width:100%;
  z-index:2;
  bottom:-20%;        /* overlap amount */
}

/* reserve overlap space */
.box::after{
  content:"";
  display:block;
  padding-bottom:22%;
}
</style>
</head>

<body>

  <div class="box">
    <video autoplay muted loop playsinline>
