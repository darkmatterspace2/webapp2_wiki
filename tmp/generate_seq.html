<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMG Generator (Multiple {N})</title>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }
  input, button {
    width: 100%;
    padding: 6px;
    margin: 6px 0;
  }
  textarea {
    width: 100%;
    height: 180px;
    margin-top: 10px;
    font-family: monospace;
  }
  .copy-btn {
    margin-top: 6px;
    font-size: 12px;
  }
</style>
</head>
<body>

<h3>Image Tag Generator — {N} Placeholder</h3>

<label>Image URL (use <b>{N}</b> anywhere):</label>
<input id="url" value="https://picsum.photos/600/img{N}_{N}.jpg">

<label>N value:</label>
<input id="count" type="number" value="4">

<button onclick="generate()">Generate</button>

<textarea id="output" readonly></textarea>

<button class="copy-btn" onclick="copyOutput()">Copy Output</button>

<script>
function generate() {
  const url = document.getElementById("url").value;
  const n = parseInt(document.getElementById("count").value);
  let result = "";

  for (let i = 1; i <= n; i++) {
    result += `<img src="${url.replaceAll('{N}', i)}">\n`;
  }

  document.getElementById("output").value = result;
}

function copyOutput() {
  const output = document.getElementById("output");
  output.select();
  output.setSelectionRange(0, 99999); // mobile support
  navigator.clipboard.writeText(output.value);
}
</script>

</body>
</html>
