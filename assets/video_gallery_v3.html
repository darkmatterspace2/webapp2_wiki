<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stable Hover Preview Gallery</title>

<style>
html,body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
}

/* MASONRY */
.gallery{
  column-count:3;
  column-gap:0;
}

/* TILE */
.tile{
  position:relative;
  break-inside:avoid;
  cursor:pointer;
}

/* MEDIA */
.poster,
.preview2,
.full{
  width:100%;
  display:block;
}

/* PREVIEW OVERLAY */
.preview2{
  position:absolute;
  inset:0;
  object-fit:cover;
  opacity:0;
  pointer-events:none;
  transition:opacity .15s linear;
}

/* SHOW PREVIEW */
.tile:hover .preview2{
  opacity:1;
}

/* CAPTION */
.caption{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:10px 12px;
  font-size:13px;
  line-height:1.4;
  background:linear-gradient(to top,rgba(0,0,0,.75),transparent);
  opacity:0;
  transition:.2s;
}

.tile:hover .caption{opacity:1}

/* CLEAN LINKS */
.caption a{
  color:#9ad1ff;
  text-decoration:none;
  border-bottom:1px solid rgba(154,209,255,.35);
}
.caption a:hover{
  border-bottom-color:#9ad1ff;
}

/* RESPONSIVE */
@media(max-width:900px){.gallery{column-count:2}}
@media(max-width:500px){.gallery{column-count:1}}
</style>
</head>

<script>
document.querySelectorAll(".tile").forEach(tile=>{
  const preview = tile.querySelector(".preview2");

  tile.addEventListener("mouseenter",()=>{
    preview.play().catch(()=>{});
  });

  tile.addEventListener("mouseleave",()=>{
    preview.pause();
    preview.currentTime=0;
  });

  tile.addEventListener("click",()=>{
    if(tile.querySelector(".full")) return;

    const full=document.createElement("video");
    full.src=tile.dataset.video;
    full.controls=true;
    full.autoplay=true;
    full.playsInline=true;
    full.className="full";

    tile.innerHTML="";
    tile.appendChild(full);
  });
});
</script>
