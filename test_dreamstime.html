<!DOCTYPE html>
<html>
<head>
<style>
  .box1 {
    width: 300px;
    height: 400px;
    border: 2px solid red;
    background: url('https://thumbs.dreamstime.com/b/happy-cute-kids-go-home-school-vector-164179861.jpg') center top / cover no-repeat;
  }
  .box2 {
    width: 300px;
    height: 400px;
    border: 2px solid blue;
    background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.4)), url('https://thumbs.dreamstime.com/b/happy-cute-kids-go-home-school-vector-164179861.jpg') center top / cover no-repeat;
  }
</style>
</head>
<body>
  <h1>Image Test</h1>
  <img id="img-test" src="https://thumbs.dreamstime.com/b/happy-cute-kids-go-home-school-vector-164179861.jpg" width="200" alt="Test Image" onerror="console.error('IMG FAILED TO LOAD')" onload="console.log('IMG LOADED SUCCESS')" />
  <div class="box1">Box 1</div>
  <div class="box2">Box 2</div>
  <script>
    const img = document.getElementById('img-test');
    img.onerror = () => document.body.innerHTML += '<p style="color:red">Image failed to load (hotlink or CORS or 403)</p>';
    img.onload = () => document.body.innerHTML += '<p style="color:green">Image loaded successfully!</p>';
  </script>
</body>
</html>
